<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="DrDer-Switch - لعبة ألغاز بسيطة وممتعة تعمل بدون إنترنت">
    <title>DrDer-Switch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="192.png" type="image/png">
    <link rel="apple-touch-icon" href="192.png">
</head>
<body>
    <!-- الشاشة الرئيسية -->
    <div id="home-screen" class="screen active">
        <div class="home-content">
            <h1 class="game-title">DrDer-Switch</h1>
            <p class="game-subtitle">لعبة ألغاز بسيطة وممتعة</p>
            <button id="start-btn" class="primary-btn">بدأ اللعب</button>
            <button id="continue-btn" class="secondary-btn hidden">متابعة من المرحلة <span id="continue-level"></span></button>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen" class="screen">
        <header class="game-header">
            <h1 class="game-title-small">DrDer-Switch</h1>
        </header>
        <div class="game-info">
            <span class="level-info">المرحلة: <span id="level-number">1</span></span>
            <span class="moves-info">الحركات: <span id="moves-count">0</span></span>
        </div>
        <div id="game-board" class="game-board"></div>
        <div class="game-actions">
            <button id="reset-btn" class="action-btn">إعادة</button>
            <button id="next-btn" class="action-btn hidden">المرحلة التالية</button>
        </div>
    </div>

    <!-- شاشة الفوز -->
    <div id="win-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>المرحلة مكتملة!</h2>
            <p>ممتاز!</p>
            <button id="overlay-next-btn" class="primary-btn">المرحلة التالية</button>
            <button id="overlay-home-btn" class="secondary-btn">الرئيسية</button>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
